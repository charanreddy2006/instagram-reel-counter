name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Unit Tests
        run: gradle test

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-brainrot-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct 1-Click APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Brainrot Reel Tracker ${{ github.ref_name }}
          body: |
            ### 📱 Direct Download for Android Phone
            Tap **app-debug.apk** below directly from your phone browser to download and install!
          files: app/build/outputs/apk/debug/app-debug.apk
